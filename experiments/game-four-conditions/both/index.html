<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOON HOP</title><link rel="stylesheet" href="style.css"></head>
<body><main class="shell"><header><a class="brand" href="./index.html">MOON<span>HOP</span><small>月面探索 / SECTOR 04</small></a><nav aria-label="メニュー"><button id="help">遊び方</button><button id="settings">設定</button><button id="pause">Ⅱ 一時停止</button></nav></header>
<section class="game" aria-label="月面探索"><div class="hud"><div class="distance"><span>走行距離</span><strong>378<small> / 600 m</small></strong><div class="track"><i></i><b title="チェックポイント400m"></b></div><span class="checkpoint">次のチェックポイント 400 m <em>あと22 m</em></span></div><div class="vitals"><div><span>シールド</span><strong id="shield">◆ ◆ ◇ <small>2 / 3</small></strong></div><div><span>エネルギー</span><strong id="energy">68%</strong><meter id="energyMeter" min="0" max="100" value="68">68%</meter></div></div><div class="collect"><span>鉱石 <strong>12 / 20</strong></span><span class="combo">コンボ ×3</span><button id="missions" aria-label="ミッション2件を確認">ミッション 2件 ↗</button></div></div>
<div class="landscape"><canvas id="scene" width="1200" height="480" aria-label="星空と月の山々、月面に立つ宇宙飛行士"></canvas><div id="jumpEffect" aria-hidden="true">↑</div></div>
<div class="coordinates" aria-hidden="true">MARE TRANQUILLITATIS <span>00° 40′ N</span></div>
<div class="controls"><div class="items"><button id="repair"><span>＋ 修理キット <b id="kitCount">1</b></span><small>シールドを1回復</small></button><button id="boost"><span>ϟ ブースト <b id="boostCount">2</b></span><small>エネルギーを20%回復</small></button></div><button id="jump" class="primary jump">ジャンプ <span>↗</span><small>Space / ↑ / W</small></button></div><p id="feedback" role="status" aria-live="polite"></p>
<div id="stateOverlay" class="overlay" hidden><section class="statePanel"><span class="eyebrow" id="stateEyebrow"></span><h1 id="stateTitle" tabindex="-1"></h1><p id="stateReason"></p><div id="resultStats" hidden><div><span>今回の距離</span><strong>378 <small>m</small></strong></div><div><span>セッションベスト</span><strong>1,220 <small>m</small></strong></div></div><button id="stateAction" class="primary"></button></section></div>
</section><footer class="demo"><div><strong>UIデモ</strong><span>実際の移動・衝突判定・音声・記録保存はありません。</span></div><label>画面を確認 <select id="demoState"><option value="play">プレイ</option><option value="pause">一時停止</option><option value="result">リザルト</option></select></label></footer></main>
<dialog id="dialog"><div class="dialogHead"><h2 id="dialogTitle"></h2><button id="close" aria-label="閉じる">×</button></div><section id="dialogContent"></section></dialog>
<script type="module" src="app.js"></script></body></html>
