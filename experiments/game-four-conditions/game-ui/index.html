<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOON HOP</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header><span class="emblem">◒</span><div><h1>MOON HOP</h1><small>LUNAR EXPEDITION / 07</small></div></header><main class="viewport"><canvas id="scene" width="1200" height="480" aria-label="宇宙飛行士と月面の風景"></canvas><div class="sector">静かの海 <small>SECTOR 03</small></div><section class="hud" aria-label="ステータス"><div class="distance"><span>走行距離</span><strong>378<small> m</small></strong><span>/ 600 m</span></div><div class="route"><i></i><b></b></div><div class="next">チェックポイント <b>400 m</b><span>あと22 m</span></div><div class="vitals"><div><span>シールド</span><strong id="shield"></strong></div><div><span>エネルギー</span><b id="energy-label"></b></div><meter id="energy" min="0" max="100" value="68">68%</meter></div></section><nav class="menu" aria-label="メニュー"><button id="pause" aria-label="一時停止">Ⅱ</button><button data-open="help" aria-label="遊び方">?</button><button data-open="settings" aria-label="設定">⚙</button></nav><div class="cargo"><button data-open="missions">◇ <strong>12<small>/20</small></strong> 鉱石 ⌄</button><span>COMBO <b>×3</b></span></div><div id="hop" aria-hidden="true">↑<br>HOP!</div><span class="coordinates">MOON / 1.62 m/s²</span><div class="controls"><div class="items"><button id="repair"><span>＋</span><small id="repair-count"></small><b>修理</b></button><button id="boost"><span>ϟ</span><small id="boost-count"></small><b>ブースト</b></button></div><button id="jump"><span>↑</span> ジャンプ <kbd>SPACE</kbd></button></div><p class="keys">SPACE / ↑ / W でジャンプ</p><p id="feedback" role="status" aria-live="polite"></p><div id="overlay" hidden><section class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" tabindex="-1"><span id="panel-code"></span><h2 id="panel-title"></h2><div id="panel-body"></div><button id="primary"></button></section></div></ma
