<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOON HOP — スキル適用版</title><link rel="stylesheet" href="style.css"></head><body><nav class="specimen"><a href="../index.html">事例一覧</a><span>UIデモ：移動・衝突・音声は省略</span><label>表示状態 <select id="demo-state"><option value="play">プレイ</option><option value="pause">一時停止</option><option value="result">結果</option></select></label></nav><main id="game" data-state="play"><header class="game-header"><h1>MOON<span> / </span>HOP</h1><div class="header-actions"><button id="pause" aria-label="一時停止" title="一時停止">Ⅱ</button><button id="settings" aria-label="設定" title="設定">⚙</button><button id="help" aria-label="遊び方" title="遊び方">?</button></div></header><div class="game-layout"><section class="play-column" aria-label="ゲーム画面"><div class="stage"><div class="hud"><div class="survival"><div><span class="label">シールド</span><div class="shields" id="shields" aria-label="シールド2/3"><i></i><i></i><i class="empty"></i></div></div><div class="energy"><div class="meter-label"><span class="label">エネルギー</span><output id="energy-value">68%</output></div><meter id="energy" value="68" min="0" max="100">68%</meter></div></div><div class="distance"><span class="label">距離</span><strong>378<small> / 600 m</small></strong></div><div class="collection"><div><span class="label">鉱石</span><strong>12<small> / 20</small></strong></div><div><span class="label">コンボ</span><strong>×3</strong></div></div></div><div class="scene"><canvas width="1200" height="480" tabindex="0" aria-label="月面の配達ロボット。Space、上矢印、Wでジャンプの動作を試せます。"></canvas><div class="checkpoint"><span>次のチェックポイント</span><b>400 m</b></div></div><div class="controls"><div class="equipment"><span class="label">装備</span><button id="repair"><span>＋ 修復</span><small>×<output id="repair-count">1</output></small></button><button id="boost"><span>↗ ブースト</span><small>×<output id="boost-count">2</output></small></button></div><button id="jump" class="jump">ジャンプ <kbd>Space</kbd></button></div><section class="screen" id="screen" hidden aria-labelledby="screen-title"><div class="screen-content"><h2 id="screen-title" tabindex="-1"></h2><p id="screen-reason"></p><div id="result-data" hidden><span class="label">今回の距離</span><strong>378<small> m</small></strong><dl><div><dt>最高距離</dt><dd>1,220 m</dd></div><div><dt>回収した鉱石</dt><dd>12 / 20</dd></div></dl></div><button class="primary" id="resume">続ける</button><button class="text-button" id="restart">最初から</button></div></section></div><div class="route"><span>第04区間</span><div class="route-line"><i></i><b title="チェックポイント400m"></b></div><span>採掘基地</span></div></section><aside class="mission-panel"><div class="mission-heading"><h2>ミッション</h2><button id="mission-toggle" aria-label="ミッションの表示切替" aria-expanded="true" aria-controls="mission-body">−</button></div><div id="mission-body"><article><span class="mission-number" aria-hidden="true">○</span><div><h3>鉱石を回収</h3><p>区間の終点までに目標数を集める</p></div></article><article><span class="mission-number" aria-hidden="true">○</span><div><h3>被弾せず次の地点へ</h3><p>シールドを失わず到達する</p></div></article></div></aside></div><p id="notice" role="status" class="sr"></p></main><dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="dialog-close" aria-label="閉じる">×</button></div><div id="dialog-body"></div><button class="primary" id="dialog-done">閉じる</button></dialog><script type="module" src="app.js"></script></body></html>
