<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>漫画原稿・トーン調整 | UIUX-control</title><link rel="stylesheet" href="style.css"></head><body>
<header><span class="brand">UIUX-control <span>事例</span></span><nav aria-label="事例"><a href="../">比較一覧</a></nav><span class="demo">UIデモ · サンプル表示／画像変換・保存は行いません</span></header>
<main><div class="document"><div><span class="eyebrow">漫画原稿</span><h1>帰り道 / 第1話</h1></div><span class="document-info">3ページ · サンプル原稿</span></div>
<div class="workspace"><aside class="pages pane"><h2>ページ <span>3</span></h2><div class="page-list"></div><section class="layers"><h2>レイヤー</h2><label><input type="checkbox" checked data-layer="line"> <span>線画</span><small>通常</small></label><label class="selected"><input type="checkbox" checked data-layer="tone"> <span>トーン</span><small>調整対象</small></label><label><input type="checkbox" checked data-layer="paper"> <span>用紙</span><small>白</small></label></section></aside>
<section class="editor" aria-label="原稿プレビュー"><div class="canvas-toolbar"><strong id="filename">page_01.png</strong><div class="zoom"><button id="zoom-out" aria-label="縮小">−</button><output id="zoom-value">100%</output><button id="zoom-in" aria-label="拡大">＋</button><button id="fit">全体</button></div></div><div id="viewport" tabindex="0" aria-label="原稿。拡大時はドラッグまたは矢印キーで移動"><div id="paper"><img id="art" src="manga.svg" alt="街路と人物を描いた漫画のサンプル原稿" draggable="false"><div id="tone-overlay"></div><span class="page-mark">01</span></div></div><div class="canvas-footer"><span id="render-status" role="status"></span><span>ドラッグで移動</span></div></section>
<aside class="settings pane"><div class="mobile-tabs" aria-label="設定の切替"><button data-tab="tone" aria-pressed="true">トーン</button><button data-tab="pages">ページ</button><button data-tab="export">書き出し</button></div><section class="tone-section"><div class="section-head"><h2>トーン調整</h2><label class="preview"><input id="preview" type="checkbox" checked>プレビュー</label></div><p id="preview-note" hidden><span id="preview-reason"></span> <button id="show-tone" type="button" hidden>表示する</button></p><label class="preset-label" for="preset">プリセット</label><select id="preset"><option value="custom" disabled>カスタム</option><option value="standard">標準・網点</option><option value="light">淡い背景</option><option value="dark">濃い影</option></select><div id="sliders"></div><div class="edit-actions"><button id="undo" disabled>↶ 取り消す</button><button id="reset">初期値に戻す</button></div></section><section class="export-section"><h2>書き出し</h2><div class="fields"><label>形式<select id="format"><option>PNG</option><option>TIFF</option></select></label><label>対象<select id="scope"><option>現在のページ</option><option>全3ページ</option></select></label></div><button id="export" class="primary">書き出しを確認</button><p id="export-message" role="status" hidden></p></section><section class="detail-section"><h2>原稿情報</h2><dl><div><dt>サイズ</dt><dd>600 × 740 px</dd></div><div><dt>カラーモード</dt><dd>グレースケール</dd></div><div><dt>適用先</dt><dd>トーンレイヤー</dd></div></dl></section></aside></div></main><script src="app.js"></script></body></html>
